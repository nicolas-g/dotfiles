---
- block:
    - name: atuin | Create {{ home_dir }}/.config/atuin dir
      file:
        path: "{{ home_dir }}/.config/atuin"
        state: directory
        mode: 0700
        owner: "{{ user }}"
        group: "{{ group }}"

    - name: atuin | Deploy atuin config.toml
      template:
        src: "atuin_config.toml.j2"
        dest: "~/.config/atuin/config.toml"
        mode: 0600
        owner: "{{ user }}"
        group: "{{ group }}"
  tags: atuin
